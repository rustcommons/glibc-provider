# Rust Commons standard release pipeline; see
# https://github.com/rustcommons/.github/blob/main/docs/TRUSTED-PUBLISHING.md
# crates.io binds Trusted Publishing to this file name and the `crates-io`
# environment; never rename either.
name: Trusted publishing
on:
  push:
    tags: ['v*']
  # Dry runs: gate and build only, never publish.
  pull_request:
    paths:
      - '.github/workflows/trusted-publishing.yml'
      - 'scripts/release-gate.py'
      - 'scripts/check-release-docs.py'
      - 'scripts/verify-crate-checksum.py'
      - 'CHANGELOG.md'
      - 'docs/releases/**'
  workflow_dispatch:
permissions:
  contents: read
# A tag run is never cancelled; only newer pushes to the same PR supersede.
concurrency:
  group: trusted-publishing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Release gate
    # Later jobs of this workflow request id-token; dry runs are for this
    # repository's own branches only, so fork PRs skip the workflow's jobs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads CI results for the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      crates: ${{ steps.gate.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - name: Decide whether this run may publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-gate.py --event "$EVENT" --ref-name "$REF_NAME" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build
    needs: gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      CRATES: ${{ needs.gate.outputs.crates }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain publishes the crate; 0.1.2 was packaged with it.
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - name: Package release crates
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          echo "DIST=$dist" >> "$GITHUB_ENV"
          cargo fetch --locked
          for crate in $(jq -r '.[]' <<<"$CRATES"); do
            # Also builds the crate from its packaged source.
            cargo package --locked -p "$crate"
            cp "target/package/$crate-$VERSION.crate" "$dist/"
          done
      # Former publish-job qualification: crates.io accepts at most 10 MB; keep room.
      - name: Package size limit
        run: |
          set -euo pipefail
          for f in "$DIST"/*.crate; do
            size=$(stat -c %s "$f")
            echo "$(basename "$f"): $size bytes"
            test "$size" -le 9000000
          done
      - name: SBOM and SHA256SUMS
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.10 --locked --root "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/cargo-cyclonedx" cyclonedx --format json --spec-version 1.5 \
            --target x86_64-unknown-linux-gnu --override-filename "glibc-provider-sources-$VERSION.cdx"
          # The unpublished collector gets its own file; only the crate's SBOM ships.
          rm -f "collector/glibc-provider-sources-$VERSION.cdx.json"
          mv "glibc-provider-sources-$VERSION.cdx.json" "$DIST/"
          (cd "$DIST" && sha256sum ./*.crate ./*.cdx.json | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)
      - name: Re-check SHA256SUMS
        run: cd "$DIST" && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  attest:
    name: Checksums and attestations
    # `gate` is listed only so the condition can read its output.
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/dist
      - name: Re-check SHA256SUMS
        run: cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.crate
            ${{ runner.temp }}/dist/*.cdx.json
      - name: Save the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/dist/glibc-provider-$VERSION.crates.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish to crates.io
    needs: [gate, build, attest]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The owner's approval click.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      CRATES: ${{ needs.gate.outputs.crates }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/dist
      - name: Re-check SHA256SUMS
        run: cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS
      # No registry token exists yet: packaging runs build scripts.
      - name: Repackage and compare with the attested files
        id: plan
        run: |
          set -euo pipefail
          pending=()
          for crate in $(jq -r '.[]' <<<"$CRATES"); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'rustcommons-release' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already on crates.io; skipping."
              continue
            fi
            # Publish only bytes identical to the checksummed, attested file.
            cargo package --locked -p "$crate"
            cmp "target/package/$crate-$VERSION.crate" "$RUNNER_TEMP/dist/$crate-$VERSION.crate"
            pending+=("$crate")
          done
          echo "crates=${pending[*]}" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.plan.outputs.crates != ''
        id: auth
      # The token exists only in this step, which builds nothing: the package
      # was verified above, so publishing skips cargo's verification build.
      - name: Publish release crates in dependency order
        if: steps.plan.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.plan.outputs.crates }}
        run: |
          set -euo pipefail
          for crate in $PENDING; do
            cargo publish --locked --no-verify -p "$crate"
          done

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/dist
      - name: Create the release from the committed notes; add only missing files
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          (cd "$dist" && sha256sum -c SHA256SUMS)
          notes="docs/releases/v$VERSION.md"
          title=$(grep -m1 '^# ' "$notes" | sed 's/^# //')
          test -n "$title"
          files=("$dist"/*.crate "$dist"/*.cdx.json "$dist/SHA256SUMS" "$dist/glibc-provider-$VERSION.crates.intoto.jsonl")
          for f in "${files[@]}"; do test -f "$f"; done
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existing=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in "${files[@]}"; do
              if grep -Fxq "$(basename "$f")" <<<"$existing"; then
                echo "Keeping existing asset $(basename "$f")"
              else
                gh release upload "v$VERSION" "$f" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file "$notes" "${files[@]}"
          fi

  verify:
    name: Verify publication
    needs: [gate, github-release]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the attached release files
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          echo "ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Live release body equals the committed notes
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published-tag "v$VERSION"
      - name: crates.io checksum equals the attested crate
        run: python3 scripts/verify-crate-checksum.py --archive "$ASSETS/glibc-provider-sources-$VERSION.crate"
      - name: Verify attestations of the attached files
        run: |
          set -euo pipefail
          for f in "$ASSETS"/*.crate "$ASSETS"/*.cdx.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trusted-publishing.yml" \
              --bundle "$ASSETS/glibc-provider-$VERSION.crates.intoto.jsonl"
          done
      - name: docs.rs build (pending is reported as pending)
        run: |
          set -euo pipefail
          url="https://docs.rs/crate/glibc-provider-sources/$VERSION/status.json"
          for attempt in $(seq 1 40); do
            body=$(curl -s -A 'rustcommons-release' -w '\n%{http_code}' "$url")
            code=$(tail -n1 <<<"$body")
            if [ "$code" = 200 ]; then
              status=$(head -n -1 <<<"$body" | jq -r '.doc_status')
              if [ "$status" = true ]; then echo "docs.rs built glibc-provider-sources $VERSION."; exit 0; fi
              if [ "$status" = false ]; then echo "::error::docs.rs build failed for glibc-provider-sources $VERSION"; exit 1; fi
            fi
            sleep 30
          done
          echo "::warning::docs.rs build for glibc-provider-sources $VERSION is still pending after 20 minutes; not a pass."
          echo "docs.rs: PENDING" >> "$GITHUB_STEP_SUMMARY"
