name: Trusted Publishing
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Only this job can request the crates.io publishing token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - name: Validate tag and release documents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          assert package["name"] == "glibc-provider-sources"
          assert os.environ["RELEASE_TAG"] == "v" + package["version"], "tag/version mismatch"
          PYTHON
          python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - name: Package and check size before authentication
        run: |
          cargo package --locked -p glibc-provider-sources
          test "$(stat -c %s target/package/glibc-provider-sources-*.crate)" -le 9000000
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the library (collector is unpublished)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p glibc-provider-sources
      - name: Verify registry and official archive checksums
        run: python3 scripts/verify-crate-checksum.py
