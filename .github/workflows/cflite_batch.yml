name: ClusterFuzzLite batch
# Fuzzes the pack, delta and table loaders (docs/FUZZING.md).
on:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
# New commits cancel obsolete runs for the same PR, not other PRs/events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Upload crash SARIF; GitHub withholds it from forks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Code-change mode diffs against the base branch.
          persist-credentials: false
      - name: Build fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          keep-unaffected-fuzz-targets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz for 1800 seconds in total
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          mode: batch
          fuzz-seconds: 1800
          output-sarif: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload crash SARIF
        if: always() && hashFiles('cifuzz-sarif/results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: cifuzz-sarif/results.sarif
          category: clusterfuzzlite
