name: Replay
# Rebuilds every release's startup objects and nonshared archives with each GCC
# version and compares them with the recorded container build (docs/REPLAY.md).
# A failing entry means linux-abi-tools' `source` mode must not be offered with
# that compiler. Images are pinned by digest in qualification/replay-images.json,
# so a run tests exactly the compiler named; the monthly Replay images workflow
# proposes new digests for review. Each job records its exact compiler version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
# New commits cancel obsolete runs for the same PR, not other PRs/events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: images
        name: Read the digest-pinned compiler images
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, re
          entries = json.load(open("qualification/replay-images.json"))
          pinned = re.compile(r"[a-z0-9][a-z0-9._-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}")
          assert all(pinned.fullmatch(e["image"]) for e in entries), "unpinned image"
          print("images=" + json.dumps(entries, separators=(",", ":")))
          PYTHON
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      # Static, so it runs in every image below.
      - run: cargo build --release --locked --offline --target x86_64-unknown-linux-musl -p glibc-provider-collector --bin glibc-provider-replay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay
          path: target/x86_64-unknown-linux-musl/release/glibc-provider-replay
  replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Upstream GCC releases, then distribution GCC with the defaults users get.
        include: ${{ fromJSON(needs.build.outputs.images) }}
    runs-on: ubuntu-24.04
    # Every image is name:tag@sha256:<digest>; the build job refuses anything else.
    container: ${{ matrix.image }} # zizmor: ignore[unpinned-images]
    steps:
      - if: matrix.install
        env:
          INSTALL_SCRIPT: ${{ matrix.install }}
        run: bash -e -c "$INSTALL_SCRIPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replay
      - shell: bash
        env:
          COMPILER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          chmod +x glibc-provider-replay
          {
            echo "## $COMPILER_NAME"
            echo
            echo '```'
            gcc --version | head -1
            ld --version | head -1
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          status=0
          qualification/replay-all.sh ./glibc-provider-replay gcc out || status=$?
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            out/summary.md
            out/*.log
            out/*/report.tsv
