name: Replay
# Rebuilds every release's startup objects and nonshared archives with each GCC
# version and compares them with the recorded container build (docs/REPLAY.md).
# A failing entry means linux-abi-tools' `source` mode must not be offered with
# that compiler. Images are pinned by digest (resolved 2026-11-18), so a run
# tests exactly the compiler named; refresh the digests by hand to qualify the
# GCC users have today. Each job records its exact compiler version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
# New commits cancel obsolete runs for the same PR, not other PRs/events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      # Static, so it runs in every image below.
      - run: cargo build --release --locked --offline --target x86_64-unknown-linux-musl -p glibc-provider-collector --bin glibc-provider-replay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay
          path: target/x86_64-unknown-linux-musl/release/glibc-provider-replay
  replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream GCC releases, without distribution defaults.
          - { name: GCC 12, image: "gcc:12@sha256:3d3af69c72edf0652bb3a829965142e81891899c7827d849bc3c0dbb9edd216a" }
          - { name: GCC 13, image: "gcc:13@sha256:8c0fe724784c6d617cb582f79ddaf5dd2233aaba2fb7a14e0b9d03348fea8088" }
          - { name: GCC 14, image: "gcc:14@sha256:a6f425a380ee03e682df3b436fc9077c544fb0fea0a9cab943c3b8320db10765" }
          - { name: GCC 15, image: "gcc:15@sha256:60a0af4b79226d7cb062cc18dcb56f91b4385aace8f6d514f114c3f1af363ef1" }
          - { name: GCC 16, image: "gcc:16@sha256:5c2f83335c97e233c80d2bc754bd5c46b2d9c32f236a765a4ac40a59f216c064" }
          # Distribution GCC, with the defaults users actually get.
          - { name: Rocky Linux 9 (GCC 11), image: "rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4", install: "dnf install -y gcc binutils" }
          - { name: Ubuntu 24.04 (GCC 13), image: "ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8", install: "apt-get update && apt-get install -y gcc binutils" }
          - { name: Debian 13 (GCC 14), image: "debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6", install: "apt-get update && apt-get install -y gcc binutils" }
          - { name: Fedora 43 (GCC 15), image: "fedora:43@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5", install: "dnf install -y gcc binutils" }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - if: matrix.install
        env:
          INSTALL_SCRIPT: ${{ matrix.install }}
        run: bash -e -c "$INSTALL_SCRIPT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replay
      - shell: bash
        env:
          COMPILER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          chmod +x glibc-provider-replay
          {
            echo "## $COMPILER_NAME"
            echo
            echo '```'
            gcc --version | head -1
            ld --version | head -1
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          status=0
          qualification/replay-all.sh ./glibc-provider-replay gcc out || status=$?
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            out/summary.md
            out/*.log
            out/*/report.tsv
