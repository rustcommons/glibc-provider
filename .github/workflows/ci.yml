name: CI
on:
  push:
    branches: [main]
  pull_request:
# New commits cancel obsolete runs for the same PR, not other PRs/events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        # Dependabot keeps one Linux core job; full OS coverage runs otherwise.
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: cargo doc --no-deps --locked --offline -p glibc-provider-sources
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - run: cargo test --workspace --locked --offline
  data:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: Every blob matches its name and every table entry has a blob
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bad=0
          while read -r f; do
            [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$(basename "$f")" ] || { echo "bad blob $f"; bad=1; }
          done < <(find data/blobs -type f)
          for t in data/2.*/files.tsv data/2.*/headers.tsv; do
            col=3; case "$t" in *headers.tsv) col=2 ;; esac
            tail -n +2 "$t" | cut -f$col | grep -v '^$' | while read -r h; do
              [ -f "data/blobs/${h:0:2}/$h" ] || { echo "missing blob $h ($t)"; exit 1; }
            done
          done
          exit $bad
  pack:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: The crate's pack holds exactly data/, and the crate packages under the size limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
      - run: cargo run --release --locked --offline -p glibc-provider-collector --bin glibc-provider-pack -- --check
      - name: Package and verify glibc-provider-sources
        run: |
          set -euo pipefail
          cargo package -p glibc-provider-sources --locked
          size=$(stat -c %s target/package/glibc-provider-sources-*.crate)
          echo "crate size: $size bytes"
          # crates.io accepts at most 10 MB; keep room for future releases.
          [ "$size" -le 9000000 ]
