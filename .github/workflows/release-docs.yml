name: Release documentation
on:
  push:
  pull_request:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      verify_published:
        description: Verify all existing GitHub Release notes and the latest version
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Old source tags predate their documentation backfill.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - name: Check committed changelog and versioned notes
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - name: Check this published GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published-tag "$RELEASE_TAG"
      - name: Check all published notes and latest release
        if: github.event_name == 'workflow_dispatch' && inputs.verify_published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published
