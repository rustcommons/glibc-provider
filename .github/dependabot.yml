version: 2
# Version-update scheduling/limits do not delay advisory-driven security updates.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    ignore:
      # These SHAs select deliberate Rust versions, including the 1.90 MSRV.
      # Toolchain updates require manual review; do not replace them with latest.
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
